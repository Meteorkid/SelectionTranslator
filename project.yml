name: SelectionTranslator
options:
  bundleIdPrefix: com.meteor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SelectionTranslator:
    type: application
    platform: macOS
    sources:
      - path: Sources/SelectionCore
      - path: Sources/SelectionTranslatorApp
      - path: Support/Resources/ecdict.tsv
        buildPhase: resources
      - path: Support/Resources/NOTICE.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: PRIVACY.md
        buildPhase: resources
    dependencies:
      - sdk: Vision.framework
      - sdk: AVFoundation.framework
      - sdk: CoreServices.framework
      - sdk: ApplicationServices.framework
      - sdk: PDFKit.framework
      - sdk: libsqlite3.tbd
      - package: Sparkle
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 划词翻译
        CFBundleShortVersionString: "0.4.2"
        CFBundleVersion: "7"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSSupportsAutomaticTermination: false
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Apache-2.0 · Local-first reading assistant"
        SUFeedURL: "https://github.com/Meteorkid/SelectionTranslator/releases/latest/download/appcast.xml"
        SUPublicEDKey: "EMncmQ+lSAoFN/zZs+ntpIzQnrOJjY2iw6wYPRG1wKI="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.meteor.SelectionTranslator.url
            CFBundleURLSchemes:
              - selectiontranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteor.SelectionTranslator
        PRODUCT_NAME: SelectionTranslator
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SelectionTranslatorApp/BridgingHeader.h
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "7"

  SelectionTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SelectionTranslatorTests
    dependencies:
      - target: SelectionTranslator
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteor.SelectionTranslatorTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SelectionTranslator.app/Contents/MacOS/SelectionTranslator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  SelectionTranslatorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/SelectionTranslatorUITests
    dependencies:
      - target: SelectionTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteor.SelectionTranslatorUITests
        TEST_TARGET_NAME: SelectionTranslator
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  SelectionProbe:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SelectionCore
      - path: Sources/SelectionProbe
    dependencies:
      - sdk: Vision.framework
      - sdk: AVFoundation.framework
      - sdk: CoreServices.framework
      - sdk: ApplicationServices.framework
      - sdk: PDFKit.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteor.SelectionProbe
        PRODUCT_NAME: selection-probe

schemes:
  SelectionTranslator:
    build:
      targets:
        SelectionTranslator: all
    run:
      config: Debug
    test:
      targets:
        - SelectionTranslatorTests
  SelectionTranslatorUITests:
    build:
      targets:
        SelectionTranslator: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SelectionTranslatorUITests
  SelectionProbe:
    build:
      targets:
        SelectionProbe: all
    run:
      config: Debug
